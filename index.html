*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── TOPBAR ── */

  return `<img loading="lazy" src="${h(chain[0])}" data-fb='${h(JSON.stringify(chain.slice(1)))}' alt="">`;
}
document.addEventListener('error',e=>{
  const i=e.target;if(i.tagName!=='IMG'||!i.dataset.fb)return;

// ───── SEARCH ─────
// normalise: lowercase, inch marks -> "inch", keep digits and fractions (1/2), drop punctuation
const SYN={spanner:'wrench',spanners:'wrench',pincer:'plier',cutter:'cutter',drilling:'drill',screwdriver:'screw driver',hammers:'hammer'};
function norm(s){
  return clean(s).toLowerCase().replace(/["”″]|(\d)\s*(inches|inch|in)\b/g,(m,d)=>d?d+' inch':' inch ')
    .replace(/[^a-z0-9/.\s]/g,' ').replace(/\s\.|\.\s/g,' ').replace(/\s+/g,' ').trim();
}
function stem(w){
  if(SYN[w])w=SYN[w];
  if(w.length>4&&w.endsWith('ies'))return w.slice(0,-3)+'y';
  if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss'))return w.slice(0,-1);
  return w;
}
const toks=s=>norm(s).split(' ').filter(Boolean).flatMap(w=>stem(w).split(' '));
function ed1(a,b){ // true if edit distance <=1
  if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,e=0;
  while(i<la&&j<lb){
    if(a[i]===b[j]){i++;j++;continue}
    if(++e>1)return false;
    if(la>lb)i++;else if(lb>la)j++;else{i++;j++}
  }
  return e+(la-i)+(lb-j)<=1;
}
function buildIndex(){
  parents.forEach(p=>{
    p._n=toks(p.name+' '+p.variants.map(v=>v.variant_name).join(' '));
    p._c=toks(p.category);
    p._s=p.variants.map(v=>v.sku.toLowerCase().replace(/[^a-z0-9]/g,'')).concat(p.parent_sku.toLowerCase().replace(/[^a-z0-9]/g,''));
    p._t=norm(p.name+' '+p.variants.map(v=>v.variant_name).join(' '));
  });
}
function scoreTok(t,p){
  const raw=t.replace(/[^a-z0-9]/g,'');
  if(raw.length>=3&&p._s.some(s=>s.includes(raw)))return 6;       // item code
  let best=0;
  for(const w of p._n){
    if(w===t)return 4;
    if(w.startsWith(t))best=Math.max(best,3);
    else if(t.length>=3&&w.includes(t))best=Math.max(best,2);
    else if(t.length>=4&&ed1(t,w))best=Math.max(best,1.5);
  }
  if(!best)for(const w of p._c){if(w===t||w.startsWith(t)){best=1;break}}
  return best;
}
function search(q){
  const qt=toks(q);if(!qt.length)return parents;
  const need=qt.length>3?qt.length-1:qt.length;
  const nq=norm(q),out=[];
  parents.forEach((p,idx)=>{
    let sum=0,hit=0;
    for(const t of qt){const s=scoreTok(t,p);if(s){hit++;sum+=s}}
    if(hit<need)return;
    if(p._t.includes(nq))sum+=6;                                     // whole phrase
    if(p._t.startsWith(nq))sum+=3;
    out.push([sum+hit*2,idx,p]);
  });
  return out.sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(x=>x[2]);
}

function card(p){

  return `<button class="card" data-p="${h(p.parent_sku)}">
    <div class="im">${p.image?imgTag(p.image):'🔧'}${multi?`<span class="vb">${p.variants.length} options</span>`:''}</div>
    <div class="bd"><div class="nm">${h(p.name)}</div>${priceBlock(p)}</div></button>`;
}
function apply(){
  query=$('q').value;

  shown=PAGE;draw();
}
function draw(){
  const g=$('grid');

    $('info').textContent='';g.insertAdjacentHTML('beforebegin','');
    g.innerHTML='<div class="empty" style="grid-column:1/-1"><div style="font-size:40px">🔍</div><p style="margin-top:6px"><b>No products found</b></p><p style="font-size:13px">Try fewer words or another spelling</p></div>';return}
  g.innerHTML=results.slice(0,shown).map(card).join('');
  $('more').style.display=shown<results.length?'block':'none';
  $('info').textContent=`${results.length} product${results.length===1?'':'s'}${query.trim()?` for “${query.trim()}”`:cat!=='All'?` in ${cat}`:''}`;

function openSheet(html){$('sheet').innerHTML='<button class="x" data-close>×</button>'+html;$('sheet').scrollTop=0;$('sheet').classList.add('open');$('shade').classList.add('open');document.body.style.overflow='hidden'}

function renderProduct(){

// ───── CART ─────

document.addEventListener('click',e=>{

async function load(){

      const r=await fetch(SUPABASE_URL+'/rest/v1/products?select=sku,parent_sku,name,variant_name,category,image,price&order=sort.asc',
        {cache:'no-store',headers:{apikey:SUPABASE_KEY,Range:`${from}-${from+999}`,'Range-Unit':'items'}});

    }

    const map=new Map();

}

// ─── SEARCH ────────────────────────────────────────────
function editDist(a,b){
  if(a===b)return 0;
  if(a.length>b.length){const t=a;a=b;b=t;}
  let row=Array.from({length:a.length+1},(_,i)=>i);
  for(let j=1;j<=b.length;j++){
    let prev=j;
    for(let i=1;i<=a.length;i++){const v=b[j-1]===a[i-1]?row[i-1]:Math.min(row[i-1],row[i],prev)+1;row[i-1]=prev;prev=v;}
    row[a.length]=prev;
  }
  return row[a.length];
}

function searchParents(q){
  const tokens = q.split(/\s+/).filter(Boolean);
  if(!tokens.length) return allParents;
  const scored = [];
  for(const p of allParents){
    const base = [p.name, p.category, p.description, p.parent_sku].join(' ').toLowerCase();
    const vhay = p.variants.map(v=>[v.sku,v.variant_name,v.size,v.model,(v.attributes||[]).map(a=>a.value).join(' ')].join(' ')).join(' ').toLowerCase();
    const hay = base + ' ' + vhay;
    if(hay.includes(q)){scored.push({p,s:100});continue;}
    if(tokens.every(t=>hay.includes(t))){scored.push({p,s:80});continue;}
    const mc=tokens.filter(t=>hay.includes(t)).length;
    if(mc>=tokens.length-1&&mc>0){scored.push({p,s:60});continue;}
    let fz=0;
    for(const t of tokens){
      if(t.length<3){if(hay.includes(t))fz++;continue;}
      for(const w of hay.split(/[\s\-\/]+/)){
        if(Math.abs(w.length-t.length)>2)continue;
        if(editDist(t,w.substring(0,t.length+2))<=1){fz++;break;}
      }
    }
    if(fz>=Math.ceil(tokens.length*.6))scored.push({p,s:fz*10});
  }
  scored.sort((a,b)=>b.s-a.s);
  return scored.map(x=>x.p);
}

// ─── IMAGE RETRY ───────────────────────────────────────
// Google Drive thumbnails sometimes fail on first load — retry up to 3x with backoff
function imgRetry(img){
  // Drive-derived images carry a fallback host queue — work through it first.
  const fbRaw = img.getAttribute('data-fallbacks');
  if(fbRaw){
    let chain; try{ chain = JSON.parse(fbRaw); }catch(e){ chain = []; }
    if(chain.length){
      const next = chain.shift();
      img.setAttribute('data-fallbacks', JSON.stringify(chain));
      img.src = next;
      return;
    }
    img.removeAttribute('data-fallbacks');
  }
  const tries = parseInt(img.dataset.tries||'0');
  if(tries >= 3){
    // Give up — show placeholder
    img.style.display='none';
    const ph = img.nextElementSibling;
    if(ph && ph.classList.contains('no-img')) ph.style.display='flex';
    return;
  }
  img.dataset.tries = tries + 1;
  const src = img.src;
  // Force cache-bust by appending a random param (makes Drive re-serve the image)
  const sep = src.includes('?') ? '&' : '?';
  setTimeout(()=>{
    img.src = src.split('&_r=')[0].split('?_r=')[0] + sep + '_r=' + Date.now();
  }, 800 * Math.pow(2, tries)); // 0.8s, 1.6s, 3.2s
}

async function loadData(){
  const tg=document.getElementById('trendingGrid'); if(tg)tg.innerHTML=skels(6);
  const cg=document.getElementById('catalogGrid'); if(cg)cg.innerHTML=skels(12);
  try{
    // Flat table: one row per sheet row (= one variant). Paged because Supabase caps responses (~1000 rows).
    const rowsAll = [];
    for(let from=0;;from+=1000){
      const res = await fetch(SUPABASE_URL+'/rest/v1/products?select=sku,parent_sku,name,variant_name,category,image,price,stock,carton_qty&order=sort.asc',{
        cache:'no-store',
        headers:{apikey:SUPABASE_KEY, Range:`${from}-${from+999}`, 'Range-Unit':'items'}
      });
      if(!res.ok) throw new Error('Supabase error '+res.status);
      const part = await res.json();
      rowsAll.push(...part);
      if(part.length<1000) break;
    }
    if(!rowsAll.length) throw new Error('products table is empty - run the sheet sync');
    const byParent = new Map();
    for(const r of rowsAll){
      if(!r.sku||!r.name||!r.parent_sku) continue;
      let p = byParent.get(r.parent_sku);
      if(!p){
        p = { parent_sku:clean(r.parent_sku), name:clean(r.name), brand:'', category:clean(r.category), subcategory:'', description:'', image:clean(r.image), price_min:null, variants:[] };
        byParent.set(r.parent_sku, p);
      }
      if(!p.image && r.image) p.image = clean(r.image);
      p.variants.push({
        sku:clean(r.sku), variant_name:clean(r.variant_name), size:'', model:'', image:clean(r.image),
        attributes:[], price:r.price, stock:r.stock, carton_qty:r.carton_qty
      });
    }
    allParents = [...byParent.values()];
    allParents.forEach(p=>{ const pr=p.variants.map(v=>v.price).filter(x=>x!=null); p.price_min = pr.length?Math.min(...pr):null; });
    console.log(`Loaded ${allParents.length} parents, ${allParents.reduce((s,p)=>s+p.variants.length,0)} variants`);
    // trending (optional, never blocks the catalog)
    try{
      const tr=await fetch(SUPABASE_URL+'/rest/v1/trending?select=*',{headers:{apikey:SUPABASE_KEY}});
      if(tr.ok){ const t=await tr.json(); trendingCodes=t.map(r=>r.parent_sku||r.parentSku||r.sku).filter(Boolean); }
    }catch(e){ trendingCodes=[]; }
  }catch(e){
    console.error('Load failed:',e);
    const cg2=document.getElementById('catalogGrid');
    if(cg2)cg2.innerHTML=`<div class="no-results"><p style="color:#ef4444;font-size:15px;font-weight:700;margin-bottom:6px">⚠️ Could not load products</p><p style="font-size:12px">${e.message}</p><p style="font-size:11px;margin-top:4px">Check browser console (F12) for details</p></div>`;
    allParents=[];
  }
  const hc=document.getElementById('heroCount'); if(hc&&allParents.length)hc.textContent=allParents.length+'+';
  const cats=[...new Set(allParents.map(p=>p.category).filter(Boolean))].sort();
  buildCatNavs(cats);
  buildSidebar(); renderTrending(); renderCatalog();
  loaded=true; finishLoad();
}
