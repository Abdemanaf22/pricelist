<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PTJYRNV7EH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-PTJYRNV7EH');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro-Cut | Tools That Scream Quality</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Pro-Cut product catalogue - hand tools, power tools, garage tools and more">
<meta name="theme-color" content="#FFB800">
<style>
:root{--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#f6f7f9;--card:#fff;--brand:#FFB800;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--brand);padding:8px 12px 0;padding-top:max(8px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain}
.top b{font-size:17px;letter-spacing:.2px}
.top a{margin-left:auto;font-size:13px;font-weight:700;background:#fff;border-radius:20px;padding:6px 12px;text-decoration:none;color:var(--ink)}
.search{position:relative;margin:8px 0}
.search input{width:100%;height:44px;border:0;border-radius:12px;padding:0 40px 0 14px;font-size:16px;background:#fff;outline:none}
.search button{position:absolute;right:4px;top:4px;width:36px;height:36px;font-size:20px;color:var(--mute);display:none}
.search.has button{display:block}
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:7px 13px;border-radius:20px;background:rgba(255,255,255,.55);font-size:13px;font-weight:600;white-space:nowrap}
.cats button.on{background:var(--ink);color:#fff}

/* list */
main{padding:10px}
.info{font-size:13px;color:var(--mute);margin:2px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}main{max-width:1100px;margin:auto}}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;text-align:left}
.card .im{position:relative;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px}
.card .im img{width:100%;height:100%;object-fit:contain}
.card .vb{position:absolute;left:6px;top:6px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 7px}
.card .bd{padding:8px 9px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .nm{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pr{margin-top:auto;padding-top:4px}
.pr .main{font-size:17px;font-weight:800}
.pr .main small{font-size:11px;font-weight:600;color:var(--mute);margin-right:3px}
.pr .off{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--green);font-weight:600;line-height:1.5}
.pr .off span:first-child{color:var(--mute);font-weight:500}
.more{display:block;margin:14px auto;padding:11px 26px;border-radius:24px;background:var(--ink);color:#fff;font-weight:700}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.skel{height:230px;border-radius:12px;background:linear-gradient(90deg,#eceef1,#f6f7f9,#eceef1);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* bottom sheet */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.shade.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:18px 18px 0 0;z-index:41;overflow-y:auto;transform:translateY(105%);transition:transform .22s;padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:auto}
.sheet.open{transform:none}
.sheet .x{position:sticky;top:0;float:right;margin:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.95);font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:2}
.sheet .big{aspect-ratio:1;max-height:46vh;width:100%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:60px}
.sheet .big img{width:100%;height:100%;object-fit:contain}
.sheet .in{padding:12px 14px 16px}
.sheet h2{font-size:18px;line-height:1.25}
.sku{font-size:12px;color:var(--mute);margin-top:3px}
.prices{margin:12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prices div{display:flex;justify-content:space-between;padding:9px 12px;font-size:14px}
.prices div+div{border-top:1px solid var(--line)}
.prices .l{font-size:20px;font-weight:800;background:#fffbeb}
.prices .g b{color:var(--green)}
.vl{font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.vr{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:14px}
.vr.sel{border-color:var(--ink);background:#f9fafb}
.vr span:last-child{font-weight:700;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.wa{background:var(--green);color:#fff}
.btn.add{background:var(--ink);color:#fff}

/* cart */
.fab{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;height:50px;border-radius:25px;background:var(--green);color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;gap:8px;max-width:536px;margin:auto}
.fab.show{display:flex}
.ci{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ci .t{flex:1;font-size:13.5px;line-height:1.3}.ci .t small{display:block;color:var(--mute)}
.q{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.q button{width:34px;height:34px;font-size:18px}
.q input{width:38px;text-align:center;border:0;background:none;font-weight:700;font-size:15px}
.ci .rm{color:var(--red);font-size:20px;width:30px}
.ch{padding:14px;font-size:17px;font-weight:800}

/* enquiry share page */
.enq{padding:12px}.enq .ec{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;align-items:center}
.enq .ec img,.enq .ec .ph{width:72px;height:72px;object-fit:contain;flex:none;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<header>
  <div class="top">
    <img src="favicon.png" alt="" onerror="this.style.display='none'">
    <b>Pro-Cut Catalogue</b>
    <a href="tel:+919323120324">📞 Call</a>
  </div>
  <div class="search" id="sbox">
    <input id="q" type="search" placeholder="Search tools, size, code…" autocomplete="off" enterkeyhint="search">
    <button id="qx" aria-label="Clear">×</button>
  </div>
  <div class="cats" id="cats"></div>
</header>

<main>
  <div class="info" id="info"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" style="display:none">Show more</button>
</main>

<div class="enq" id="enqPage" style="display:none"></div>

<button class="fab" id="fab"></button>

<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>

<script>
// ───── CONFIG ─────
const WA='919323120324';
const SUPABASE_URL='https://flydynjhbmfykonstvyu.supabase.co';
const SUPABASE_KEY='sb_publishable_yS8jrtTw4QEHbSiG9ts9_g_45hth1kO';
const DISC=[25,28.5];          // extra price lines shown under the rate (% off)
const PAGE=40;

// ───── STATE ─────
let parents=[],cat='All',query='',shown=PAGE,results=[];
let cart=[];try{cart=JSON.parse(localStorage.getItem('pc_cart')||'[]')}catch(e){}
let cur=null,curVar=0;

// ───── UTILS ─────
const $=id=>document.getElementById(id);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
const rs=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const off=(n,p)=>Math.round(n*(1-p/100));
const saveCart=()=>{try{localStorage.setItem('pc_cart',JSON.stringify(cart))}catch(e){}};

function priceBlock(p){ // card price
  const pr=p.variants.map(v=>v.price).filter(x=>x!=null);
  if(!pr.length)return '';
  const lo=Math.min(...pr),from=Math.max(...pr)>lo;
  return `<div class="pr"><div class="main">${from?'<small>From</small>':''}${rs(lo)}</div>`+
    DISC.map(d=>`<div class="off"><span>−${d}%</span><span>${rs(off(lo,d))}</span></div>`).join('')+'</div>';
}

// ───── IMAGES (Drive links routed via faster hosts, with fallbacks) ─────
function imgTag(url){
  if(!url)return '';
  const m=url.match(/(?:\/d\/|[?&]id=)([\w-]{15,})/);
  const chain=m?[`https://lh3.googleusercontent.com/d/${m[1]}=w600`,`https://images.weserv.nl/?url=${encodeURIComponent('drive.google.com/uc?export=view&id='+m[1])}`,url]:[url];
  return `<img loading="lazy" src="${h(chain[0])}" data-fb='${h(JSON.stringify(chain.slice(1)))}' alt="">`;
}
document.addEventListener('error',e=>{
  const i=e.target;if(i.tagName!=='IMG'||!i.dataset.fb)return;
  let fb;try{fb=JSON.parse(i.dataset.fb)}catch(_){fb=[]}
  if(fb.length){i.src=fb.shift();i.dataset.fb=JSON.stringify(fb)}
  else{i.style.display='none';i.parentNode.insertAdjacentHTML('beforeend','🔧')}
},true);

// ───── SEARCH ─────
// normalise: lowercase, inch marks -> "inch", keep digits and fractions (1/2), drop punctuation
const SYN={spanner:'wrench',spanners:'wrench',pincer:'plier',cutter:'cutter',drilling:'drill',screwdriver:'screw driver',hammers:'hammer'};
function norm(s){
  return clean(s).toLowerCase().replace(/["”″]|(\d)\s*(inches|inch|in)\b/g,(m,d)=>d?d+' inch':' inch ')
    .replace(/[^a-z0-9/.\s]/g,' ').replace(/\s\.|\.\s/g,' ').replace(/\s+/g,' ').trim();
}
function stem(w){
  if(SYN[w])w=SYN[w];
  if(w.length>4&&w.endsWith('ies'))return w.slice(0,-3)+'y';
  if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss'))return w.slice(0,-1);
  return w;
}
const toks=s=>norm(s).split(' ').filter(Boolean).flatMap(w=>stem(w).split(' '));
function ed1(a,b){ // true if edit distance <=1
  if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,e=0;
  while(i<la&&j<lb){
    if(a[i]===b[j]){i++;j++;continue}
    if(++e>1)return false;
    if(la>lb)i++;else if(lb>la)j++;else{i++;j++}
  }
  return e+(la-i)+(lb-j)<=1;
}
function buildIndex(){
  parents.forEach(p=>{
    p._n=toks(p.name+' '+p.variants.map(v=>v.variant_name).join(' '));
    p._c=toks(p.category);
    p._s=p.variants.map(v=>v.sku.toLowerCase().replace(/[^a-z0-9]/g,'')).concat(p.parent_sku.toLowerCase().replace(/[^a-z0-9]/g,''));
    p._t=norm(p.name+' '+p.variants.map(v=>v.variant_name).join(' '));
  });
}
function scoreTok(t,p){
  const raw=t.replace(/[^a-z0-9]/g,'');
  if(raw.length>=3&&p._s.some(s=>s.includes(raw)))return 6;       // item code
  let best=0;
  for(const w of p._n){
    if(w===t)return 4;
    if(w.startsWith(t))best=Math.max(best,3);
    else if(t.length>=3&&w.includes(t))best=Math.max(best,2);
    else if(t.length>=4&&ed1(t,w))best=Math.max(best,1.5);
  }
  if(!best)for(const w of p._c){if(w===t||w.startsWith(t)){best=1;break}}
  return best;
}
function search(q){
  const qt=toks(q);if(!qt.length)return parents;
  const need=qt.length>3?qt.length-1:qt.length;
  const nq=norm(q),out=[];
  parents.forEach((p,idx)=>{
    let sum=0,hit=0;
    for(const t of qt){const s=scoreTok(t,p);if(s){hit++;sum+=s}}
    if(hit<need)return;
    if(p._t.includes(nq))sum+=6;                                     // whole phrase
    if(p._t.startsWith(nq))sum+=3;
    out.push([sum+hit*2,idx,p]);
  });
  return out.sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(x=>x[2]);
}

// ───── RENDER LIST ─────
function card(p){
  const multi=p.variants.length>1;
  return `<button class="card" data-p="${h(p.parent_sku)}">
    <div class="im">${p.image?imgTag(p.image):'🔧'}${multi?`<span class="vb">${p.variants.length} options</span>`:''}</div>
    <div class="bd"><div class="nm">${h(p.name)}</div>${priceBlock(p)}</div></button>`;
}
function apply(){
  query=$('q').value;
  $('sbox').classList.toggle('has',!!query);
  results=query.trim()?search(query):(cat==='All'?parents:parents.filter(p=>p.category===cat));
  shown=PAGE;draw();
}
function draw(){
  const g=$('grid');
  if(!results.length){g.innerHTML='';$('more').style.display='none';
    $('info').textContent='';g.insertAdjacentHTML('beforebegin','');
    g.innerHTML='<div class="empty" style="grid-column:1/-1"><div style="font-size:40px">🔍</div><p style="margin-top:6px"><b>No products found</b></p><p style="font-size:13px">Try fewer words or another spelling</p></div>';return}
  g.innerHTML=results.slice(0,shown).map(card).join('');
  $('more').style.display=shown<results.length?'block':'none';
  $('info').textContent=`${results.length} product${results.length===1?'':'s'}${query.trim()?` for “${query.trim()}”`:cat!=='All'?` in ${cat}`:''}`;
}
function buildCats(){
  const cnt={};parents.forEach(p=>{if(p.category)cnt[p.category]=(cnt[p.category]||0)+1});
  $('cats').innerHTML=['All',...Object.keys(cnt).sort()].map(c=>`<button data-c="${h(c)}" class="${c===cat?'on':''}">${h(c)}${c==='All'?'':' · '+cnt[c]}</button>`).join('');
}

// ───── PRODUCT SHEET ─────
function openSheet(html){$('sheet').innerHTML='<button class="x" data-close>×</button>'+html;$('sheet').scrollTop=0;$('sheet').classList.add('open');$('shade').classList.add('open');document.body.style.overflow='hidden'}
function closeSheet(){$('sheet').classList.remove('open');$('shade').classList.remove('open');document.body.style.overflow=''}
function openProduct(sku){
  cur=parents.find(p=>p.parent_sku===sku);if(!cur)return;curVar=0;renderProduct();
}
function renderProduct(){
  const p=cur,v=p.variants[curVar],multi=p.variants.length>1,img=v.image||p.image;
  const prices=v.price==null?'':`<div class="prices"><div class="l"><span>Rate</span><span>${rs(v.price)}</span></div>`+
    DISC.map(d=>`<div class="g"><span>Less ${d}%</span><b>${rs(off(v.price,d))}</b></div>`).join('')+'</div>';
  const msg=`Hello, I'd like to enquire about:\n\n*${p.name}*${multi?`\nVariant: ${v.variant_name}`:''}\nSKU: ${v.sku}\n\nPlease share availability and pricing.`;
  openSheet(`<div class="big">${img?imgTag(img):'🔧'}</div><div class="in">
    <h2>${h(p.name)}</h2><div class="sku">${h(p.category)} · SKU: ${h(v.sku)}</div>${prices}
    ${multi?`<div class="vl">Choose option (${p.variants.length})</div>`+p.variants.map((x,i)=>`<button class="vr ${i===curVar?'sel':''}" data-v="${i}"><span>${h(x.variant_name||x.sku)}</span><span>${x.price==null?'':rs(x.price)}</span></button>`).join(''):''}
    <div class="acts"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">WhatsApp</a>
    <button class="btn add" data-add>${inCart(v.sku)?'✓ In list':'+ Add to list'}</button></div></div>`);
}
const inCart=sku=>cart.some(i=>i.sku===sku);

// ───── CART ─────
function updFab(){
  const n=cart.reduce((s,i)=>s+i.qty,0),f=$('fab');
  f.classList.toggle('show',n>0);f.textContent=`Enquiry list (${n}) · Send on WhatsApp`;
}
function addCart(){
  const p=cur,v=p.variants[curVar];
  if(!inCart(v.sku))cart.push({sku:v.sku,name:p.name,variant:p.variants.length>1?v.variant_name:'',qty:1});
  saveCart();updFab();renderProduct();
}
function openCart(){
  if(!cart.length)return;
  openSheet(`<div class="ch">Enquiry list</div>`+cart.map((i,x)=>`<div class="ci"><div class="t">${h(i.name)}<small>${h(i.variant)}${i.variant?' · ':''}${h(i.sku)}</small></div>
    <div class="q"><button data-q="${x}:-1">−</button><input inputmode="numeric" value="${i.qty}" data-qi="${x}"><button data-q="${x}:1">+</button></div><button class="rm" data-rm="${x}">×</button></div>`).join('')+
    `<div class="in"><div class="acts"><button class="btn add" data-clear>Clear</button><a class="btn wa" id="sendWa" target="_blank" rel="noopener" href="${waCart()}">Send on WhatsApp</a></div></div>`);
}
function waCart(){
  const lines=cart.map((i,n)=>`${n+1}. ${i.name}${i.variant?' — '+i.variant:''}\n   SKU: ${i.sku} × ${i.qty}`).join('\n');
  const link=location.origin+location.pathname+'?enquiry=1&p='+encodeURIComponent(cart.map(i=>i.sku).join(','));
  return `https://wa.me/${WA}?text=`+encodeURIComponent(`Hello, I'd like to enquire about:\n\n${lines}\n\nView Images:\n${link}\n\nPlease share availability and pricing.`);
}
function cartChanged(){saveCart();updFab();if(cart.length)openCart();else closeSheet()}

// ───── EVENTS ─────
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-p],[data-c],[data-v],[data-add],[data-close],[data-q],[data-rm],[data-clear]');
  if(e.target.id==='shade'||(t&&t.hasAttribute('data-close')))return closeSheet();
  if(!t)return;
  if(t.dataset.p)openProduct(t.dataset.p);
  else if(t.dataset.c){cat=t.dataset.c;$('q').value='';buildCats();apply();window.scrollTo(0,0)}
  else if(t.dataset.v!=null){curVar=+t.dataset.v;renderProduct()}
  else if(t.hasAttribute('data-add'))addCart();
  else if(t.dataset.q){const[x,d]=t.dataset.q.split(':');cart[x].qty=Math.max(1,cart[x].qty+ +d);saveCart();updFab();openCart()}
  else if(t.dataset.rm){cart.splice(+t.dataset.rm,1);cartChanged()}
  else if(t.hasAttribute('data-clear')){cart=[];cartChanged()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.qi!=null){cart[+e.target.dataset.qi].qty=Math.max(1,parseInt(e.target.value)||1);saveCart();updFab();$('sendWa').href=waCart()}
});
$('fab').onclick=openCart;
$('more').onclick=()=>{shown+=PAGE;draw()};
let st;$('q').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(apply,150)});
$('qx').onclick=()=>{$('q').value='';apply();$('q').focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

// ───── DATA ─────
async function load(){
  $('grid').innerHTML=Array(6).fill('<div class="skel"></div>').join('');
  try{
    const rows=[];
    for(let from=0;;from+=1000){   // Supabase returns max ~1000 rows per request
      const r=await fetch(SUPABASE_URL+'/rest/v1/products?select=sku,parent_sku,name,variant_name,category,image,price&order=sort.asc',
        {cache:'no-store',headers:{apikey:SUPABASE_KEY,Range:`${from}-${from+999}`,'Range-Unit':'items'}});
      if(!r.ok)throw new Error('Server error '+r.status);
      const part=await r.json();rows.push(...part);if(part.length<1000)break;
    }
    if(!rows.length)throw new Error('No products yet - run the sheet sync');
    const map=new Map();
    for(const r of rows){
      if(!r.sku||!r.name||!r.parent_sku)continue;
      let p=map.get(r.parent_sku);
      if(!p){p={parent_sku:clean(r.parent_sku),name:clean(r.name),category:clean(r.category),image:clean(r.image),variants:[]};map.set(r.parent_sku,p)}
      if(!p.image&&r.image)p.image=clean(r.image);
      p.variants.push({sku:clean(r.sku),variant_name:clean(r.variant_name),image:clean(r.image),price:r.price==null?null:Number(r.price)});
    }
    parents=[...map.values()];
    parents.forEach(p=>{const pr=p.variants.map(v=>v.price).filter(x=>x!=null);p.min=pr.length?Math.min(...pr):null});
    buildIndex();buildCats();
    const s=new URLSearchParams(location.search).get('q');if(s)$('q').value=s;
    apply();
    if(isEnq())renderEnq();
  }catch(e){
    console.error(e);
    $('grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><p><b>Could not load products</b></p><p style="font-size:13px;margin:6px 0 12px">${h(e.message)}</p><button class="more" style="display:block" onclick="load()">Try again</button></div>`;
  }
}

// ───── ENQUIRY LINK PAGE (?enquiry=1&p=SKU,SKU) ─────
const isEnq=()=>new URLSearchParams(location.search).get('enquiry')==='1';
function renderEnq(){
  const skus=(new URLSearchParams(location.search).get('p')||'').split(',').map(s=>s.trim()).filter(Boolean);
  const found=[];
  skus.forEach(s=>{
    for(const p of parents){const v=p.variants.find(x=>x.sku===s);
      if(v){found.push({p,v,single:false});return}
      if(p.parent_sku===s){found.push({p,v:p.variants[0],single:true});return}}
  });
  document.querySelector('header .search').style.display='none';$('cats').style.display='none';
  document.querySelector('main').style.display='none';$('fab').style.display='none';
  $('enqPage').style.display='block';
  $('enqPage').innerHTML=`<div class="ch" style="padding:4px 2px 10px">Your enquiry</div>`+(found.length?found.map(({p,v})=>`<div class="ec"><div class="ph">${(v.image||p.image)?imgTag(v.image||p.image):'🔧'}</div><div><b>${h(p.name)}</b><div class="sku">${p.variants.length>1&&v.variant_name?h(v.variant_name)+' · ':''}SKU: ${h(v.sku)}</div>${v.price!=null?`<div style="font-weight:800;margin-top:2px">${rs(v.price)}</div>`:''}</div></div>`).join(''):'<div class="empty">No products found.</div>')+
    `<a class="more" style="text-align:center;text-decoration:none" href="${location.pathname}">Browse full catalogue</a>`;
}

updFab();load();
</script>
</body>
</html>
